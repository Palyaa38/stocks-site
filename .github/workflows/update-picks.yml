name: Update Daily Stock Picks

on:
  schedule:
    # 6:30 AM PST = 14:30 UTC  (Nov–Mar, standard time)
    - cron: '30 14 * * 1-5'
    # 9:45 AM PST = 17:45 UTC  (mid-session refresh)
    - cron: '45 17 * * 1-5'
  workflow_dispatch:  # manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytz

      - name: Run stock picker
        run: python update_picks.py

      - name: Commit and push picks.json
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json
          git diff --staged --quiet || git commit -m "Daily picks update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
